_target_: src.models.DDPM_2D.DDPM_2D

cfg:
  name: cDDPM_benchmark

  # 输入与 backbone
  imageDim: [96, 96]
  rescaleFactor: 1
  spatialDims: 2D
  unet_dim: 128
  dim_mults: [1, 2, 2, 4]
  num_res_blocks: 2
  att_res: [4, 8]
  num_heads: 4
  dropout_unet: 0.0

  # cDDPM 本身的创新模块保留
  condition: true
  pretrained_encoder: false   # 若之后使用 Spark 预训练，再改为 true
  encoder_path: null

  # 扩散
  timesteps: 1000
  beta_schedule: linear
  objective: pred_x0
  loss: l1
  sampling_timesteps: 50
  ddim_sampling_eta: 0.0

  # 训练
  lr: 0.0001
  optimizer_betas: [0.9, 0.999]
  weight_decay: 0.0

  # benchmark 推理
  t_start: 500
  inference_mode: controlled
  seed: 2026

  # 禁止原项目旧评价行为
  noise_ensemble: false
  saveOutputImages: false
  evalSeg: false
  medianFiltering: false
  threshold: null